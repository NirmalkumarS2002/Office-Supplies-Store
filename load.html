
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeNest - Loading</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --header1: #0E2A47;
            --header2: #0A2038;
            --pcolor: #FF7A30;
        }

        body {
            font-family: 'Google Sans', sans-serif;
            overflow: hidden;
        }

        /* ===== LOADER SCREEN ===== */

        .loader-screen {
            position: fixed;
            inset: 0;
            background: var(--header2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            overflow: hidden;
            transition: opacity .6s ease, visibility .6s ease;
        }

        .loader-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-screen::before {
            content: "";
            position: absolute;
            top: -220px;
            right: -180px;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 122, 48, 0.25), transparent 70%);
            animation: blobPulse 6s ease-in-out infinite;
        }

        .loader-screen::after {
            content: "";
            position: absolute;
            bottom: -200px;
            left: -160px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 122, 48, 0.15), transparent 70%);
            animation: blobPulse 8s ease-in-out infinite reverse;
        }

        @keyframes blobPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .loader-logo-wrap {
            position: relative;
            z-index: 1;
            height: 110px;
            width: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border: 3px solid rgba(255, 122, 48, 0.15);
            border-top-color: var(--pcolor);
            border-radius: 50%;
            animation: spinRing 1.1s linear infinite;
        }

        @keyframes spinRing {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-box-icon {
            font-size: 42px;
            color: var(--pcolor);
            animation: boxBounce 1.6s ease-in-out infinite;
        }

        @keyframes boxBounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-6px) rotate(-6deg);
            }
        }

        .loader-brand {
            position: relative;
            z-index: 1;
            color: white;
            font-size: clamp(26px, 4vw, 34px);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .loader-brand span {
            color: var(--pcolor);
        }

        .loader-tagline {
            position: relative;
            z-index: 1;
            color: #9fb0c4;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 34px;
        }

        .loader-bar-track {
            position: relative;
            z-index: 1;
            width: 260px;
            max-width: 70vw;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pcolor), #ff9a5c);
            border-radius: 10px;
            transition: width .18s ease;
        }

        .loader-percent {
            position: relative;
            z-index: 1;
            margin-top: 14px;
            color: #cfcfcf;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .loader-percent span {
            color: var(--pcolor);
            font-weight: 700;
        }

    
    </style>

</head>

<body>

    <!-- Content behind the loader (shown once loading completes) -->
    <div class="page-preview">
        <img src="./src/logo.webp" alt="OfficeNest Logo">
        <h1>Welcome To OfficeNest</h1>
        <p>Everything for your workspace, stocked and ready. Redirecting you to the store now.</p>
        <a href="index.html">Continue To Store <span class="material-symbols-outlined">arrow_forward</span></a>
    </div>

    <!-- LOADER SCREEN -->
    <div class="loader-screen" id="pageLoader">
        <div class="loader-logo-wrap">
            <span class="loader-ring"></span>
            <span class="material-symbols-outlined loader-box-icon">inventory_2</span>
        </div>

        <h1 class="loader-brand">Office<span>Nest</span></h1>
        <p class="loader-tagline">Office & Stationery Supplies</p>

        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loaderBarFill"></div>
        </div>
        <p class="loader-percent"><span id="loaderPercentNum">0</span>%</p>
    </div>

    <script>
        const loader = document.getElementById("pageLoader");
        const barFill = document.getElementById("loaderBarFill");
        const percentNum = document.getElementById("loaderPercentNum");

        let progress = 0;

        function updateProgress() {
            progress += Math.random() * 12 + 4;
            if (progress >= 100) {
                progress = 100;
            }

            barFill.style.width = progress + "%";
            percentNum.textContent = Math.floor(progress);

            if (progress < 100) {
                setTimeout(updateProgress, 180);
            } else {
                setTimeout(() => {
                    loader.classList.add("hide");
                    document.body.style.overflow = "auto";
                }, 400);
            }
        }

        window.addEventListener("load", () => {
            updateProgress();
        });
    </script>

</body>

</html>
