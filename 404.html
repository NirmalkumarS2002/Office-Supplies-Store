<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeNest - Page Not Found</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --header1: #0E2A47;
            --header2: #0A2038;
            --border: 1px solid rgba(128, 128, 128, 0.295);
            --pcolor: #FF7A30;
        }

        body {
            overflow-x: hidden;
            scrollbar-width: none;
            font-family: 'Google Sans', sans-serif;

        }

        html {
            overflow-x: hidden;
        }

        /* ===== 404 SECTION ===== */

        .notfound-wrap {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
            overflow: hidden;
                background: var(--header1);
        }

        .notfound-wrap::before {
            content: "";
            position: absolute;
            top: -180px;
            right: -160px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 122, 48, 0.18), transparent 70%);
            animation: blobPulse 7s ease-in-out infinite;
        }

        .notfound-wrap::after {
            content: "";
            position: absolute;
            bottom: -160px;
            left: -140px;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10, 32, 56, 0.08), transparent 70%);
            animation: blobPulse 9s ease-in-out infinite reverse;
        }

        @keyframes blobPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .notfound-logo {
            position: relative;
            z-index: 1;
            margin-bottom: 30px;
        }

        .notfound-logo img {
            width: clamp(150px,17vw,180px);
        }

        .notfound-icon-stack {
            position: relative;
            z-index: 1;
            margin-bottom: 10px;
        }

        .notfound-num {
            font-size: clamp(80px, 14vw, 170px);
            font-weight: 800;
            color: white;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .notfound-num .zero-box {
            height: clamp(70px, 11vw, 130px);
            width: clamp(70px, 11vw, 130px);
            background: var(--pcolor);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(255, 122, 48, 0.35);
            animation: floatBox 3.5s ease-in-out infinite;
        }

        .notfound-num .zero-box span.material-symbols-outlined {
            font-size: clamp(38px, 6vw, 62px);
            color: black;
        }

        @keyframes floatBox {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-12px) rotate(-4deg);
            }
        }

        .notfound-wrap h1 {
            position: relative;
            z-index: 1;
            font-size: clamp(24px, 3.4vw, 34px);
            color: white;
            margin: 20px 0 12px 0;
        }

        .notfound-wrap p {
            position: relative;
            z-index: 1;
            color: #b9b9b9;
            font-size: 16px;
            max-width: 480px;
            margin: 0 auto 36px auto;
            line-height: 1.7;
        }

        .notfound-actions {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width:600px) {
            .notfound-actions {
                flex-direction: column;
                width: 100%;
                max-width: 320px;
            }
        }

        .hero-btn {
            position: relative;
            overflow: hidden;
            padding: 17px 30px;
            font-size: 15px;
            border: none;
            background: var(--pcolor);
            font-weight: 600;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: box-shadow 0.4s ease;
            text-decoration: none;
            color: black;
        }

        .hero-btn:hover {
            box-shadow: 0 0 10px rgba(255, 122, 48, 0.35), 0 0 25px rgba(255, 122, 48, 0.25);
        }

        .hero-btn span {
            font-size: 20px;
            transition: transform 0.4s ease;
        }

        .hero-btn:hover span {
            transform: translateX(6px);
        }

        .hero-btn-outline {
            padding: 16px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 7px;
            border: 1px solid #d8c5b0;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: .4s ease;
            text-decoration: none;
        }

        .hero-btn-outline:hover {
            background: var(--pcolor);
            border-color: var(--pcolor);
            color: black;
        }

        .hero-btn-outline span {
            font-size: 20px;
            transition: transform 0.4s ease;
        }

        .hero-btn-outline:hover span {
            transform: translateX(-6px);
        }
    </style>

</head>

<body>

    <!-- 404 SECTION -->
    <section class="notfound-wrap">
        <a href="index.html" class="notfound-logo"><img src="./src/logo.webp" alt="OfficeNest Logo"></a>

        <div class="notfound-icon-stack">
            <div class="notfound-num">
                4<div class="zero-box"><span class="material-symbols-outlined">inventory_2</span></div>4
            </div>
        </div>
        <h1>Looks Like This Shelf Is Empty</h1>
        <p>The page you're looking for has been moved, sold out, or never existed. Let's get you back on track.</p>

        <div class="notfound-actions">
            <a href="index.html" class="hero-btn">Back To Home <span class="material-symbols-outlined">home</span></a>
            <a href="javascript:void(0)" class="hero-btn-outline" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span>Go Back</a>
        </div>
    </section>

</body>

</html>
